<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQ - Ask a Question</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo">EduQ</a>
    <a href="index.html" class="btn btn-secondary">← Back to Feed</a>
  </nav>

  <!-- Ask Form Container -->
  <main class="auth-container" style="max-width: 600px;">
    <div class="auth-card">
      <h2>Ask an Academic Doubt</h2>
      <p class="auth-sub">Post your question</p>

      <form id="post-question-form">
        <div class="form-group">
          <label for="question-title">Question Title / Doubt</label>
          <input type="text" id="question-title" placeholder="e.g. How does QuickSort partitioning work in memory?" required>
        </div>

       

        <div class="form-group">
          <label for="target-branch">Target Branch</label>
          <select id="target-branch" required>
            <option value="IT">Information Technology (IT)</option>
            <option value="CSE">Computer Engineering (CSE)</option>
            <option value="ECE">Electronics (ECE)</option>
            <option value="MECH">Mechanical (MECH)</option>
            <option value="CIVIL">Civil (CIVIL)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="question-details">Additional Details / Context (Optional)</label>
          <textarea id="question-details" rows="5" placeholder="Explain what you have tried or specify where you are stuck..." style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; outline: none;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Post Question</button>
      </form>
    </div>
  </main>

  <script>
    // Handle form submission and redirect back to feed
    document.getElementById('post-question-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // In backend integration, send data via fetch('/api/questions') here
      alert('Question posted successfully!');
      
      // Redirect back to main dashboard feed
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
