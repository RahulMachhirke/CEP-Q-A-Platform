<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQ - Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <form class="auth-card" enctype="multipart/form-data">
      <h2>Join EduQ</h2>
      <p class="auth-sub">Let's get you started!</p>

      <p>                                                          </p>      

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="">
      </div>

      <div class="form-group">
        <label>College Email</label>
        <input type="email" name="email" required placeholder="">
      </div>

      <div class="form-group">
        <label>Branch of Study</label>
        <select name="branch" required>
          <option value="IT">Information Technology (IT)</option>
          <option value="CSE">Computer Engineering (CSE)</option>
          <option value="ECE">Electronics (ECE)</option>
          <option value="MECH">Mechanical (MECH)</option>
          <option value="CIVIL">Civil (CIVIL)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Academic Status</label>
        <select name="status" required>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
          <option value="Graduated">Graduated / Alumni</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload ID Card Photo (For Verification)</label>
        <input type="file" name="idCardPic" accept="image/*" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Register Account</button>
    </form>
  </div>

</body>
</html>
