<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo">EduQ</a>
    <div class="nav-actions">
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">🌙</button>
      <a href="index.html" class="btn btn-secondary">← Back to Feed</a>
    </div>
  </nav>

  <!-- Login Form Container -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p class="auth-sub">Enter your details to log in </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">College Email Address</label>
          <input type="email" id="login-email" placeholder="e.g. student@college.edu" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-footer">
        New to EduQ? <a href="register.html">Create an account here</a>
      </p>
    </div>
  </main>

  <script src="main.js"></script>

<footer class="footer">
    <p>&copy; 2026 EduQ rights reserved.</p>
  </footer>


</body>
</html>
